<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFL Season Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: a game-day program — year strip on top, playoff picture as two conference brackets meeting at the Super Bowl, then eight division tables in AFC / NFC rows. */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --surface-2: #f5f7fa;
  --ink: #0f1a2b;
  --muted: #5d6b80;
  --line: #dde3ec;
  --afc: #c8102e;
  --nfc: #0b4fb3;
  --gold: #c99a2e;
  --turf: #1f7a4d;
  --shadow: 0 1px 2px rgba(15,26,43,.06), 0 6px 20px rgba(15,26,43,.06);
  --display: "Big Shoulders Display", "Oswald", "Arial Narrow", Impact, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c121c; --surface: #141c29; --surface-2: #1a2433; --ink: #e9eef6; --muted: #93a1b5;
    --line: #263245; --afc: #ff5a6e; --nfc: #5b9dff; --gold: #e6bb55; --turf: #3fbf7f;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c121c; --surface: #141c29; --surface-2: #1a2433; --ink: #e9eef6; --muted: #93a1b5;
  --line: #263245; --afc: #ff5a6e; --nfc: #5b9dff; --gold: #e6bb55; --turf: #3fbf7f;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px 48px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: .01em; text-transform: uppercase; }
.num { font-variant-numeric: tabular-nums; }

/* Header */
header.top { background: linear-gradient(120deg, color-mix(in srgb, var(--afc) 92%, #000) 0%, #1a1f3a 50%, color-mix(in srgb, var(--nfc) 92%, #000) 100%); color: #fff; }
header.top .wrap { padding-top: 26px; padding-bottom: 22px; display: grid; gap: 18px; }
.title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.title-row h1 { font-size: clamp(34px, 6vw, 56px); font-weight: 900; line-height: .9; }
.title-row h1 span { color: #ffd36b; }
.status { font-weight: 600; font-size: 14px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); padding: 6px 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px; }
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: #ffd36b; }
.status.live .dot { background: #5cf09a; box-shadow: 0 0 0 4px rgba(92,240,154,.25); }

.picker { display: flex; align-items: center; gap: 10px; min-width: 0; }
.picker button.arrow { flex: none; width: 40px; height: 40px; border-radius: 12px; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.12); color: #fff; font-size: 20px; cursor: pointer; display: grid; place-items: center; }
.picker button.arrow:hover:not(:disabled) { background: rgba(255,255,255,.25); }
.picker button.arrow:disabled { opacity: .35; cursor: default; }
.years { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scroll-behavior: smooth; padding: 4px 2px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.35) transparent; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
#jump { flex: none; font: 700 15px var(--body); color: #fff; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3); border-radius: 12px; height: 40px; padding: 0 10px; cursor: pointer; }
#jump option, #jump optgroup { color: #0f1a2b; background: #fff; }
.years button { flex: none; font-family: var(--display); font-weight: 800; font-size: 19px; padding: 6px 13px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: rgba(255,255,255,.72); cursor: pointer; }
.years button:hover { color: #fff; background: rgba(255,255,255,.12); }
.years button[aria-pressed="true"] { background: #fff; color: #1a1f3a; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
button:focus-visible, select:focus-visible { outline: 3px solid #ffd36b; outline-offset: 2px; }

/* Sections */
section { margin-top: 28px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.sec-head h2 { font-size: 30px; font-weight: 800; }
.sec-head p { margin: 0; color: var(--muted); font-size: 14px; }

/* Champion banner */
.champ { margin-top: 24px; display: flex; align-items: center; gap: 18px; padding: 18px 22px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--line); position: relative; overflow: hidden; flex-wrap: wrap; }
.champ::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 8px; background: var(--champ-c, var(--gold)); }
.champ .trophy { width: 52px; height: 52px; border-radius: 14px; background: color-mix(in srgb, var(--gold) 18%, transparent); display: grid; place-items: center; flex: none; }
.champ .label { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.champ .who { font-family: var(--display); font-size: 30px; font-weight: 900; text-transform: uppercase; line-height: 1; }
.champ .score { margin-left: auto; color: var(--muted); font-weight: 600; }
.champ .score b { color: var(--ink); }

/* Badges */
.badge { --c1: #333; --c2: #999; flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--c1); color: #fff; font-family: var(--display); font-weight: 800; font-size: 12px; display: grid; place-items: center; box-shadow: inset 0 0 0 2.5px var(--c2); letter-spacing: .02em; }
.badge.lg { width: 44px; height: 44px; font-size: 16px; box-shadow: inset 0 0 0 3px var(--c2); }

/* Playoff picture */
.bracket-grid { display: grid; grid-template-columns: 1fr; gap: 18px; }
.conf { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden; }
.conf-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.conf-head h3 { font-size: 24px; font-weight: 900; }
.conf-head .pill { margin-left: auto; }
.conf.afc .conf-head h3 { color: var(--afc); }
.conf.nfc .conf-head h3 { color: var(--nfc); }
.conf-tag { width: 10px; height: 26px; border-radius: 4px; }
.conf.afc .conf-tag { background: var(--afc); }
.conf.nfc .conf-tag { background: var(--nfc); }
.conf-body { display: grid; grid-template-columns: minmax(230px, 280px) 1fr; }
.seeds { padding: 14px; border-right: 1px solid var(--line); background: var(--surface-2); display: grid; gap: 6px; align-content: start; }
.seeds h4, .rounds h4 { margin: 0 0 4px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.seed { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.seed .sn { font-family: var(--display); font-weight: 900; font-size: 20px; width: 18px; text-align: center; color: var(--muted); }
.seed .nm { font-weight: 700; line-height: 1.15; min-width: 0; }
.seed .nm small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.seed .tag { margin-left: auto; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.tag.champ-t { background: color-mix(in srgb, var(--gold) 22%, transparent); color: color-mix(in srgb, var(--gold) 70%, var(--ink)); border-color: color-mix(in srgb, var(--gold) 45%, transparent); }
.tag.sb-t { background: color-mix(in srgb, var(--gold) 10%, transparent); }
.tag.div-t { background: color-mix(in srgb, var(--turf) 14%, transparent); color: var(--turf); border-color: color-mix(in srgb, var(--turf) 35%, transparent); }
.hunt { margin-top: 8px; padding-top: 10px; border-top: 1px dashed var(--line); display: grid; gap: 6px; }
.hunt .seed { background: transparent; border-style: dashed; opacity: .9; }

.rounds { padding: 14px; display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(160px, 1fr)); gap: 14px; overflow-x: auto; }
.round { display: grid; gap: 10px; align-content: space-around; }
.round-col { display: grid; grid-template-rows: auto 1fr; gap: 6px; }
.game { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
.game .row { display: flex; align-items: center; gap: 8px; padding: 6px 10px; }
.game .row + .row { border-top: 1px solid var(--line); }
.game .row .s { font-size: 11px; font-weight: 700; color: var(--muted); width: 14px; text-align: right; }
.game .row .t { font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.game .row .sc { font-weight: 700; font-variant-numeric: tabular-nums; }
.game .row.win { background: color-mix(in srgb, var(--turf) 9%, transparent); }
.game .row.win .t, .game .row.win .sc { font-weight: 800; }
.game .row.lose .t, .game .row.lose .sc { color: var(--muted); }
.game .row.lose .badge { opacity: .55; }
.game.tbd { border-style: dashed; }
.game.tbd .row .t { color: var(--muted); font-weight: 500; }
.game.bye .row .sc { font-size: 11px; color: var(--turf); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.ot { font-size: 10px; font-weight: 800; color: var(--muted); margin-left: 4px; }
.ghost { width: 30px; height: 30px; border-radius: 50%; border: 2px dashed var(--line); flex: none; }

.sb { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); border: 1px solid var(--line); padding: 16px 18px; display: grid; gap: 10px; }
.sb-title { display: flex; align-items: center; gap: 10px; }
.sb-title h3 { font-size: 24px; font-weight: 900; color: var(--gold); }
.sb .game { max-width: 460px; }
.sb .game .row { padding: 10px 14px; font-size: 16px; }

/* Divisions */
.conf-label { display: flex; align-items: center; gap: 10px; margin: 22px 0 10px; }
.conf-label h3 { font-size: 22px; font-weight: 900; }
.conf-label.afc h3 { color: var(--afc); }
.conf-label.nfc h3 { color: var(--nfc); }
.conf-label::after { content: ""; flex: 1; height: 2px; background: var(--line); }
.divs { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 14px; }
.div { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden; }
.div h4 { margin: 0; padding: 12px 14px 10px; font-family: var(--display); font-size: 19px; font-weight: 800; text-transform: uppercase; display: flex; align-items: center; justify-content: space-between; }
.div h4 small { font-family: var(--body); font-size: 11px; font-weight: 600; color: var(--muted); text-transform: none; letter-spacing: 0; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--line); }
th:first-child { text-align: left; padding-left: 14px; }
td { padding: 8px; text-align: right; border-bottom: 1px solid var(--line); font-size: 14px; }
tr:last-child td { border-bottom: 0; }
td.team { text-align: left; padding-left: 14px; }
td.team .in { display: flex; align-items: center; gap: 9px; min-width: 0; }
td.team .nm { font-weight: 700; line-height: 1.1; }
td.team .nm small { display: block; color: var(--muted); font-weight: 500; font-size: 11.5px; }
tr.leader td { background: color-mix(in srgb, var(--lc) 9%, transparent); }
tr.leader td.team { box-shadow: inset 4px 0 0 var(--lc); }
.chip { display: inline-block; font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 6px; background: var(--ink); color: var(--surface); margin-left: 4px; vertical-align: 1px; }
.pos { color: var(--turf); font-weight: 700; }
.neg { color: var(--afc); font-weight: 700; }
.rec { font-weight: 700; white-space: nowrap; }
td { white-space: nowrap; }
td.team .nm { white-space: normal; }
.bar { height: 4px; background: var(--surface-2); border-radius: 4px; margin-top: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--lc); border-radius: 4px; }

footer { margin-top: 36px; color: var(--muted); font-size: 13px; display: grid; gap: 4px; }
footer a { color: inherit; }

@media (max-width: 1100px) { .divs { grid-template-columns: repeat(min(var(--n, 4), 2), minmax(0, 1fr)); } }
@media (max-width: 860px) {
  .conf-body { grid-template-columns: 1fr; }
  .seeds { border-right: 0; border-bottom: 1px solid var(--line); }
}
@media (max-width: 600px) {
  .wrap { padding: 0 16px 40px; }
  .divs { grid-template-columns: 1fr; }
  .rounds { grid-template-columns: repeat(var(--cols, 3), 180px); }
  .champ .score { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: reduce) { .years { scroll-behavior: auto; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="title-row">
      <h1>NFL Season <span>Board</span></h1>
      <div class="status" id="status"><span class="dot"></span><span id="status-text"></span></div>
    </div>
    <div class="picker">
      <button class="arrow" id="prev" aria-label="Previous season">&#8249;</button>
      <div class="years" id="years" role="group" aria-label="Choose season"></div>
      <button class="arrow" id="next" aria-label="Next season">&#8250;</button>
      <label class="sr" for="jump">Jump to season</label>
      <select id="jump"></select>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="champ"></div>
  <section>
    <div class="sec-head"><h2>Playoff Picture</h2><p id="po-note"></p></div>
    <div class="bracket-grid" id="bracket"></div>
  </section>
  <section>
    <div class="sec-head"><h2>Division Standings</h2><p id="div-note"></p></div>
    <div id="divisions"></div>
  </section>
  <footer>
    <div id="src"></div>
    <div>Records shown as W-L or W-L-T. Seeds and tiebreakers come from the source data. Team badges use team colors, not official logos.</div>
  </footer>
</main>

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function badge(tm, lg) { return `<span class="badge${lg ? " lg" : ""}" style="--c1:${tm.c1};--c2:${tm.c2}" aria-hidden="true">${esc(tm.abbr)}</span>`; }
function rec(r) { return r.t ? `${r.w}-${r.l}-${r.t}` : `${r.w}-${r.l}`; }
let PCT_OLD = false;
function pctOf(r) { if (PCT_OLD) return r.w + r.l ? r.w / (r.w + r.l) : 0; const g = r.w + r.l + r.t; return g ? (r.w + r.t / 2) / g : 0; }
function fmtPct(p) { return p >= 1 ? "1.000" : p.toFixed(3).replace(/^0/, ""); }

function parse(season) {
  const d = DATA[season];
  const teams = d.t.map(a => ({ code: a[0], div: a[1], conf: a[1].slice(0, 3), w: a[2], l: a[3], t: a[4], rank: a[5], pf: a[6], pa: a[7], seed: a[8], po: a[9] }));
  const games = d.g.map(a => ({ type: a[0], conf: a[1], away: a[2], as: a[3], home: a[4], hs: a[5], ot: a[6] }));
  const elim = { WC: "LostWC", DIV: "LostDV", CON: "LostCC", SB: "LostSB" };
  const byCode = Object.fromEntries(teams.map(t => [t.code, t]));
  for (const g of games) {
    const loser = g.hs > g.as ? g.away : g.home, winner = loser === g.home ? g.away : g.home;
    if (byCode[loser]) byCode[loser].po = elim[g.type];
    if (g.type === "SB" && byCode[winner]) byCode[winner].po = "WonSB";
  }
  const divs = d.divs || [["AFC", DIVS.map(x => "AFC " + x)], ["NFC", DIVS.map(x => "NFC " + x)]];
  const order = { WC: 0, DIV: 1, CON: 2, SB: 3 };
  const first = {};
  for (const g of games) for (const c of [g.away, g.home]) if (first[c] === undefined || order[g.type] < first[c]) first[c] = order[g.type];
  return { ...d, teams, games, byCode, divs, confs: divs.map(x => x[0]), first };
}

function teamRow(code, season, seed, score, cls, extra) {
  const tm = team(code, season);
  return `<div class="row ${cls || ""}"><span class="s">${seed || ""}</span>${badge(tm)}<span class="t" title="${esc(tm.full)}">${esc(tm.nick || tm.city)}</span><span class="sc">${score ?? ""}${extra || ""}</span></div>`;
}
function gameCard(g, S, season) {
  const aw = g.as > g.hs, hw = g.hs > g.as;
  const sa = S.byCode[g.away]?.seed, sh = S.byCode[g.home]?.seed;
  const ot = g.ot ? `<span class="ot">OT</span>` : "";
  return `<div class="game">${teamRow(g.away, season, sa, g.as, aw ? "win" : "lose", aw ? ot : "")}${teamRow(g.home, season, sh, g.hs, hw ? "win" : "lose", hw ? ot : "")}</div>`;
}
function tbdRow(label, seed) { return `<div class="row"><span class="s">${seed || ""}</span><span class="ghost"></span><span class="t">${esc(label)}</span><span class="sc"></span></div>`; }
function projCard(a, b, season) {
  // a = higher seed (home), b = lower seed (away); listed away first like the real games
  return `<div class="game tbd">${teamRow(b.code, season, b.seed, "", "")}${teamRow(a.code, season, a.seed, "", "")}</div>`;
}
function byeCard(t, season) {
  return `<div class="game bye">${teamRow(t.code, season, t.seed, "Bye", "")}</div>`;
}

const DEPTH = { WonSB: 0, LostSB: 1, LostCC: 2, LostDV: 3, LostWC: 4 };
function roundLabel(type, season) {
  if (season <= 1969) return { WC: "First round", DIV: "Playoff", CON: "League title" }[type];
  if (season === 1982) return { WC: "First round", DIV: "Second round", CON: "Conference" }[type];
  return { WC: "Wild Card", DIV: "Divisional", CON: "Conference" }[type];
}
function outcomeTag(po, season, conf) {
  if (season <= 1969) {
    if (po === "LostCC") return [`Lost ${conf} title`, ""];
    if (po === "LostDV") return ["Lost playoff", ""];
  }
  if (season === 1982 && po === "LostDV") return ["Lost 2nd round", ""];
  if (season === 1982 && po === "LostWC") return ["Lost 1st round", ""];
  return OUTCOME[po] || ["", ""];
}
function roman(n) {
  const m = [[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];
  let s = ""; for (const [v, r] of m) while (n >= v) { s += r; n -= v; } return s;
}
function sbName(season) { const n = season - 1965; return n === 50 ? "Super Bowl 50" : `Super Bowl ${roman(n)}`; }

function renderBracket(S, season) {
  const nSeeds = season >= 2020 ? 7 : 6;
  const live = !S.done;
  let html = "";
  S.confs.forEach((conf, ci) => {
    const cls = ci === 0 ? "afc" : "nfc";
    const confTeams = S.teams.filter(t => t.conf === conf);
    let field;
    if (live || !S.old) field = confTeams.filter(t => t.seed).sort((a, b) => a.seed - b.seed);
    else field = confTeams.filter(t => S.first[t.code] !== undefined).sort((a, b) => (DEPTH[a.po] ?? 9) - (DEPTH[b.po] ?? 9) || pctOf(b) - pctOf(a));
    const minFirst = Math.min(...field.map(t => S.first[t.code] ?? 9));
    const hasBye = t => !live && S.first[t.code] !== undefined && S.first[t.code] > minFirst;
    // Seed list
    let seeds = `<h4>${live ? "If the season ended today" : S.old ? "Playoff teams" : "Playoff seeds"}</h4>`;
    for (const t of field) {
      const tm = team(t.code, season);
      const tag = live ? (t.seed <= 4 ? ["Div. leader", "div-t"] : ["Wild card", ""]) : outcomeTag(t.po, season, conf);
      const bye = live ? t.seed === 1 : hasBye(t);
      seeds += `<div class="seed"><span class="sn">${t.seed || ""}</span>${badge(tm)}<span class="nm">${esc(tm.full)}<small class="num">${rec(t)}${bye ? " · first-round bye" : ""}</small></span>${tag[0] ? `<span class="tag ${tag[1]}">${tag[0]}</span>` : ""}</div>`;
    }
    if (live) {
      const hunt = confTeams.filter(t => !t.seed).sort((a, b) => pctOf(b) - pctOf(a) || (b.pf - b.pa) - (a.pf - a.pa)).slice(0, 3);
      seeds += `<div class="hunt"><h4>In the hunt</h4>` + hunt.map(t => { const tm = team(t.code, season); return `<div class="seed"><span class="sn"></span>${badge(tm)}<span class="nm">${esc(tm.full)}<small class="num">${rec(t)}</small></span></div>`; }).join("") + `</div>`;
    }
    // Rounds
    let rounds = "", nCols = 3;
    if (!live) {
      const g = S.games.filter(x => x.conf === conf);
      const seedOf = c => S.byCode[c]?.seed || 9;
      const sortG = arr => arr.sort((a, b) => seedOf(a.home) - seedOf(b.home));
      const types = ["WC", "DIV", "CON"].filter(ty => g.some(x => x.type === ty));
      nCols = types.length;
      types.forEach((ty, i) => {
        let inner = "";
        if (i === 0) inner += field.filter(hasBye).sort((a, b) => (a.seed || 0) - (b.seed || 0)).map(t => byeCard(t, season)).join("");
        inner += sortG(g.filter(x => x.type === ty)).map(x => gameCard(x, S, season)).join("");
        rounds += col(roundLabel(ty, season), inner);
      });
    } else {
      const s = n => field.find(t => t.seed === n);
      let wc = s(1) ? byeCard(s(1), season) : "";
      for (let i = 2; i <= 4; i++) if (s(i) && s(nSeeds + 2 - i)) wc += projCard(s(i), s(nSeeds + 2 - i), season);
      const one = s(1);
      const div = `<div class="game tbd">${tbdRow("Lowest remaining seed")}${one ? teamRow(one.code, season, 1, "", "") : tbdRow("1 seed", 1)}</div><div class="game tbd">${tbdRow("Wild Card winner")}${tbdRow("Wild Card winner")}</div>`;
      const con = `<div class="game tbd">${tbdRow("Divisional winner")}${tbdRow("Divisional winner")}</div>`;
      rounds += col("Wild Card", wc) + col("Divisional", div) + col("Conference", con);
    }
    const champ = !live && field.find(t => t.po === "WonSB" || t.po === "LostSB");
    const pill = champ ? `<span class="tag ${champ.po === "WonSB" ? "champ-t" : ""} pill">${esc(team(champ.code, season).nick || team(champ.code, season).city)} won the ${conf}</span>` : (live ? `<span class="tag pill">Projected</span>` : "");
    html += `<div class="conf ${cls}"><div class="conf-head"><span class="conf-tag"></span><h3>${conf}</h3>${pill}</div><div class="conf-body"><div class="seeds">${seeds}</div><div class="rounds" style="--cols:${nCols}">${rounds}</div></div></div>`;
  });
  // Super Bowl
  const sb = S.games.find(x => x.type === "SB");
  const sbHead = `<div class="sb-title">${trophySvg(22)}<h3>${sbName(season)}</h3><span class="tag" style="margin-left:auto">${sb ? `${season + 1} · Neutral site` : `February ${season + 1}`}</span></div>`;
  html += sb ? `<div class="sb">${sbHead}${gameCard(sb, S, season)}</div>`
             : `<div class="sb">${sbHead}<div class="game tbd">${tbdRow(`${S.confs[0]} champion`)}${tbdRow(`${S.confs[1]} champion`)}</div></div>`;
  return html;
  function col(name, inner) { return `<div class="round-col"><h4>${name}</h4><div class="round">${inner || ""}</div></div>`; }
}

function trophySvg(size) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>`;
}

function renderChamp(S, season) {
  const sb = S.games.find(x => x.type === "SB");
  if (!sb) return "";
  const w = sb.hs > sb.as ? sb.home : sb.away, l = w === sb.home ? sb.away : sb.home;
  const ws = Math.max(sb.hs, sb.as), ls = Math.min(sb.hs, sb.as);
  const tw = team(w, season), tl = team(l, season);
  return `<div class="champ" style="--champ-c:${tw.c1}"><div class="trophy">${trophySvg(30)}</div>${badge(tw, true)}<div><div class="label">${season} season champions</div><div class="who">${esc(tw.full)}</div></div><div class="score num">Beat the ${esc(tl.full)} <b>${ws}–${ls}</b>${sb.ot ? " in OT" : ""}</div></div>`;
}

function renderDivisions(S, season) {
  let html = "";
  S.divs.forEach(([conf, names], ci) => {
    html += `<div class="conf-label ${ci === 0 ? "afc" : "nfc"}"><h3>${conf === "AFL" ? "American Football League" : conf === "NFL" ? "National Football League" : conf}</h3></div><div class="divs" style="--n:${names.length}">`;
    for (const name of names) {
      const rows = S.teams.filter(t => t.div === name).sort((a, b) => a.rank - b.rank);
      const anyTies = rows.some(r => r.t);
      html += `<div class="div"><h4>${name}</h4><table><thead><tr><th>Team</th><th>${anyTies ? "W-L-T" : "W-L"}</th><th>Pct</th><th title="Points for minus points against">Diff</th></tr></thead><tbody>`;
      for (const r of rows) {
        const tm = team(r.code, season);
        const p = pctOf(r), diff = r.pf - r.pa;
        const chip = r.seed ? `<span class="chip" title="Playoff seed">#${r.seed}</span>` : "";
        html += `<tr class="${r.rank === 1 ? "leader" : ""}" style="--lc:${tm.c1}"><td class="team"><div class="in">${badge(tm)}<span class="nm">${esc(tm.nick || tm.city)}${chip}<small>${esc(tm.city)}</small></span></div></td><td><span class="rec">${rec(r)}</span><div class="bar"><i style="width:${(p * 100).toFixed(1)}%"></i></div></td><td>${fmtPct(p)}</td><td title="${r.pf} scored, ${r.pa} allowed" class="${diff > 0 ? "pos" : diff < 0 ? "neg" : ""}">${diff > 0 ? "+" : ""}${diff}</td></tr>`;
      }
      html += `</tbody></table></div>`;
    }
    html += `</div>`;
  });
  return html;
}

function fmtDate(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
}

const yearsEl = document.getElementById("years");
yearsEl.innerHTML = seasons.map(s => `<button type="button" data-y="${s}" aria-pressed="false">${s}</button>`).join("");
const jump = document.getElementById("jump");
jump.innerHTML = [...new Set(seasons.map(s => Math.floor(s / 10) * 10))].reverse().map(dec => `<optgroup label="${dec}s">` + seasons.filter(s => Math.floor(s / 10) * 10 === dec).reverse().map(s => `<option value="${s}">${s}</option>`).join("") + `</optgroup>`).join("");
jump.addEventListener("change", () => select(+jump.value));
yearsEl.addEventListener("click", e => { const b = e.target.closest("button[data-y]"); if (b) select(+b.dataset.y); });
document.getElementById("prev").addEventListener("click", () => step(-1));
document.getElementById("next").addEventListener("click", () => step(1));
document.addEventListener("keydown", e => {
  if (e.target.closest("input, select, textarea")) return;
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});
let current = seasons[seasons.length - 1];
function step(d) { const i = seasons.indexOf(current) + d; if (i >= 0 && i < seasons.length) select(seasons[i]); }

function select(season, fromHash) {
  current = season;
  PCT_OLD = season < 1972;
  const S = parse(season);
  jump.value = String(season);
  for (const b of yearsEl.querySelectorAll("button")) {
    const on = +b.dataset.y === season;
    b.setAttribute("aria-pressed", on);
    if (on) { const r = b.offsetLeft - yearsEl.clientWidth / 2 + b.clientWidth / 2; yearsEl.scrollTo({ left: r }); }
  }
  document.getElementById("prev").disabled = season === seasons[0];
  document.getElementById("next").disabled = season === seasons[seasons.length - 1];
  const st = document.getElementById("status");
  st.classList.toggle("live", !S.done);
  document.getElementById("status-text").textContent = S.done ? `${season} season · Final` : `${season} season · In progress · Through Week ${S.wk}`;
  document.getElementById("champ").innerHTML = renderChamp(S, season);
  const fieldN = Object.keys(S.first).length;
  document.getElementById("po-note").textContent = S.done
    ? `${fieldN} teams made the field${season <= 1969 ? " · AFL and NFL champions met in the Super Bowl" : season === 1982 ? " · strike-shortened season, 8-team tournament per conference" : ""}`
    : `Projected seeding with games through ${fmtDate(S.last)} · lower seed listed first`;
  document.getElementById("bracket").innerHTML = renderBracket(S, season);
  document.getElementById("div-note").textContent = S.old ? `Final regular-season records${season < 1972 ? " · ties left out of Pct, per the rules then" : ""}` : S.done ? "Final regular-season records · #n marks a playoff seed" : "Current records · #n marks a current playoff seed";
  document.getElementById("divisions").innerHTML = renderDivisions(S, season);
  document.title = `NFL Season Board · ${season}`;
  if (!fromHash && location.hash !== `#season-${season}`) { try { history.replaceState(null, "", `#season-${season}`); } catch (e) { location.hash = `season-${season}`; } }
}
document.getElementById("src").innerHTML = `Data: <a href="https://github.com/fivethirtyeight/nfl-elo-game">FiveThirtyEight NFL game results</a> for ${seasons[0]}–2001 (standings computed from scores; when teams finish with equal records, older division order is approximate) and <a href="https://github.com/nflverse/nfldata">nflverse nfldata</a> for 2002–${seasons[seasons.length - 1]}. Snapshot taken Nov 10, 2026; the current season does not update automatically.`;

function fromHash() {
  const m = /^#season-(\d{4})$/.exec(location.hash);
  if (m && DATA[m[1]]) { select(+m[1], true); return true; }
  return false;
}
window.addEventListener("hashchange", fromHash);
if (!fromHash()) select(current, true);
</script>
</body>
</html>
